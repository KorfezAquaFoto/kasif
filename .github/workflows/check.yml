name: Kaşif ekran ve görev testleri
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  mobile-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow fonttools brotli
      - run: python tests/prepare_font.py
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/responsive.py
      - run: python tests/platforms.py
      - run: python tests/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telefon-ekranlari
          path: tests/out/*.png
